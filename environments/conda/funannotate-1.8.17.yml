# funannotate-1.8.17.yml — pure conda: the released 1.8.17 from bioconda.
#
# Build (once) into your conda envs root, then select it at runtime:
#   mamba env create -f environments/conda/funannotate-1.8.17.yml \
#       -p /rhome/jstajich/conda/envs/funannotate-1.8.17
#   nextflow run ... -profile annotate,slurm,conda --conda_env funannotate-1.8.17
#
# Run deps mirror the bioconda recipe (conda-forge + bioconda). augustus is
# pinned to ==3.5.0 exactly as the recipe does — a newer augustus breaks
# funannotate's ab-initio training (funannotate#1013).
name: funannotate-1.8.17
channels:
  - bioconda
  - conda-forge
dependencies:
  - python >=3.6,<3.12
  - setuptools <81
  - biopython <1.80
  # Pinned >=1.4.12: unpinned can resolve to 1.2.3 (bioconda), which uniquely
  # among goatools builds hard-depends on bioconductor-goseq ->
  # bioconductor-genelendatabase, whose r42 post-link script is broken
  # against a newer icu resolved elsewhere in the env (dyn.load:
  # libicui18n.so.58 missing -- icu/stringi ABI mismatch from channel drift).
  # Every other goatools version has no R/bioconductor dependency at all.
  # Confirmed 2026-09-14: this env's own solve is no longer immune to it
  # (funannotate-1.9.0-beta.11.yml's comment assumed 1.8.17 reliably landed
  # on a clean r-base 4.3.3 solve by luck -- that luck ran out). Pin the same
  # combo proven working there.
  - goatools >=1.4.12,<2
  - r-base =4.3.3
  - seaborn-base
  - psutil
  - pandas
  - matplotlib-base
  - natsort
  - numpy
  - requests
  - scikit-learn
  - scipy
  - distro
  # 3rd-party runtime tools (as in the bioconda recipe):
  - augustus ==3.5.0
  - bamtools !=2.5.2
  - bedtools
  - blast
  - codingquarry
  - diamond
  - evidencemodeler =1.1.1
  - ete3
  - exonerate
  - glimmerhmm
  - fasta3
  - hisat2
  - hmmer
  - kallisto >=0.46.0,<0.46.2
  - mafft >=7
  - minimap2
  - pasa
  - phyml
  - pigz
  - proteinortho
  - raxml
  # Pinned <2: salmon 2.x is the Rust rewrite and dropped/changed the classic
  # CLI flags (--minAssignedFrags, -l U) that Trinity's bundled
  # salmon_runner.pl calls during genome-guided isoform filtering -- salmon
  # 2.7.0 (unpinned resolve, 2026-09-07) makes every Trinity assembly fail
  # with "unexpected argument '--minAssignedFrags' found" after burning
  # hours on the assembly itself. 1.10.3 is the last classic-CLI LTS release.
  - salmon =1.10.3
  - samtools
  - snap
  - stringtie
  - tantan
  - tbl2asn
  - trimal
  - trimmomatic
  - trinity
  - trnascan-se
  - ucsc-blat
  - ucsc-pslcdnafilter
  # perl-dbd-mysql's .so needs libmysqlclient.so.24 (PASA's mysql backend
  # loads it via DBD::mysql) -- confirmed 2026-09-08 that an unpinned fresh
  # solve lands on mysql-libs 8.3.0 (ships only .so.23/.so.18), breaking
  # PASA at the create_mysql_cdnaassembly_db.dbi step ("install_driver(mysql)
  # failed ... libmysqlclient.so.24: cannot open shared object file").
  # funannotate-1.9.0-beta.11.yml already pins this for the same reason.
  - mysql-libs =8.4.2
  - mysql-common =8.4.2
  # The package itself (latest 1.8.x build):
  - funannotate =1.8.17