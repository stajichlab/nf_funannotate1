# ServiceAccount + Role for Nextflow's k8s executor. The namespace comes from
# the overlay (kustomize sets it here and on the RoleBinding subject). Includes
# batch/jobs, needed to run tasks as Jobs (k8s.computeResourceType = 'Job'):
# NRP limits controller-less pods to 16 cores / 32 GB and a 6 h lifetime.
# Applying RBAC needs a namespace admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nextflow-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nextflow-runner
rules:
  # One pod (or Job) per task; logs are tailed; task scripts go in ConfigMaps.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nextflow-runner
subjects:
  - kind: ServiceAccount
    name: nextflow-runner
roleRef:
  kind: Role
  name: nextflow-runner
  apiGroup: rbac.authorization.k8s.io
