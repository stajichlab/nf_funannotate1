# ServiceAccount + Role for Nextflow's k8s executor in ucr-stajichlab. Shared
# with the BFD project (../BFD/k8s/rbac.yaml); this copy adds batch/jobs,
# needed to run tasks as Jobs (k8s.computeResourceType = 'Job'): NRP limits
# controller-less pods to 16 cores / 32 GB and a 6 h lifetime.
#
# Apply (needs a namespace admin): kubectl apply -f k8s/rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nextflow-runner
  namespace: ucr-stajichlab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nextflow-runner
  namespace: ucr-stajichlab
rules:
  # One pod (or Job) per task; logs are tailed; task scripts go in ConfigMaps.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nextflow-runner
  namespace: ucr-stajichlab
subjects:
  - kind: ServiceAccount
    name: nextflow-runner
    namespace: ucr-stajichlab
roleRef:
  kind: Role
  name: nextflow-runner
  apiGroup: rbac.authorization.k8s.io
